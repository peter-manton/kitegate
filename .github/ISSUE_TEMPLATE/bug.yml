name: Bug
description: Something other than a safety bypass is broken.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: If content gets past screening, report it privately instead. See SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Kitegate version and Python version
