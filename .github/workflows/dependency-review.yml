name: dependency-review

# Blocks a pull request that adds a dependency with a known vulnerability.
# Needs the dependency graph, which is on for public repositories and, for
# private ones, requires GitHub Code Security. Skipped while private.

on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
