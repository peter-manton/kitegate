name: pr-title

# PRs are squash-merged with the PR title as the commit message, and that
# message is what python-semantic-release reads to decide the next version.
# So the title has to be a Conventional Commit, e.g.
#   feat(core): add a values pack for primary schools
#   fix(gateway): hold streamed replies until screened
#   feat(openwebui)!: rename the filter valves      (breaking change)
# A scope is required. See CONTRIBUTING.md.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Types, scopes and their meaning are in CONTRIBUTING.md; keep the
          # lists here and in .pre-commit-config.yaml in step with it.
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
            style
          requireScope: true
          scopes: |
            core
            packs
            gateway
            images
            photos
            openwebui
            librechat
            nemo
            deploy
            tools
            tests
            docs
            ci
            repo
            deps
            deps-dev
            release
