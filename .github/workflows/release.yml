name: release

# Cuts a release on every push to main (which, with squash-only merging, means
# every merged PR), once the test suite has passed on that exact commit.
# python-semantic-release reads the Conventional Commit messages since the
# last tag and decides whether there is anything to release; most pushes
# (docs, ci, chore, build) release nothing. Configuration is in
# [tool.semantic_release] in pyproject.toml.
#
# The release commit and tag are pushed with GITHUB_TOKEN, which by design
# does not trigger further workflow runs, so the release cannot loop. If main
# is ever put behind branch protection, GITHUB_TOKEN will no longer be allowed
# to push to it, and this needs a GitHub App token with a bypass instead.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    # One release at a time, in order: two quick merges must not race to tag.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The branch rather than the bare SHA, since the release commit is
          # pushed back to it; full history, since the next version is worked
          # out from every commit since the last tag.
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      # The branch may have moved on since this run started. Release the
      # commit that was tested, not whatever is newest; a later push gets its
      # own run.
      - name: Check out the tested commit
        run: git reset --hard "$GITHUB_SHA"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - run: pip install "python-semantic-release==10.7.0" "build==1.6.1"

      # --no-vcs-release: version, changelog, build, commit and tag, but not the
      # GitHub Release, which is made in the next step.
      - name: Version, changelog, commit and tag
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          semantic-release -v version --no-vcs-release

      # This repository has immutable releases on: once a release is published
      # its assets can no longer change. semantic-release publishes the release
      # and only then uploads the package, which GitHub refuses with HTTP 422
      # ("Cannot upload assets to an immutable release"). So the release is
      # made the way immutable releases need: as a draft, with the package
      # attached, and then published. The notes are this version's section of
      # the changelog that the step above just wrote.
      - name: Publish the GitHub Release with the package attached
        if: steps.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          notes="$(awk -v tag="$TAG" '/^## /{ if (found) exit; found = (index($0, "## " tag " ") == 1); next } found' CHANGELOG.md)"
          if [ -z "$notes" ]; then notes="Release $TAG"; fi
          gh release create "$TAG" build/pkg/* --draft --verify-tag --title "$TAG" --notes "$notes"
          gh release edit "$TAG" --draft=false
