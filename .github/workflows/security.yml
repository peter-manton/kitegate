name: security

# The pre-commit hooks are the first line, but they only run on machines where
# someone installed them, and --no-verify exists. This is the same two scanners
# over the whole tree and the whole history, where nobody can skip them.

on:
  push:
  pull_request:
  # A secret scanner finds things with detectors it did not have last month,
  # so re-run against an unchanged tree.
  schedule:
    - cron: "37 6 * * 1"

permissions:
  contents: read

jobs:
  hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - run: pip install "pre-commit==4.6.2"
      # Skipped here rather than everywhere: TruffleHog is the job below, and
      # pytest is test.yml, which installs the package it needs. This job
      # deliberately installs nothing else.
      - run: pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: trufflehog,pytest

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Scan the whole history, not just the tip: a key removed in a later
          # commit is still published.
          fetch-depth: 0
      # The release tarball, checked against a SHA-256 written down here. The
      # install script from the project's main branch was piped into sh before,
      # so whatever that branch held on the day was run. To upgrade, change the
      # version and the hash together (from trufflehog_<version>_checksums.txt
      # on the release page).
      - name: TruffleHog
        env:
          TRUFFLEHOG_VERSION: "3.99.2"
          TRUFFLEHOG_SHA256: 3c7b0d1dc4278294269bfdd7594bca8bb28c78da0a4a06ad202ded37b48deca4
        run: |
          archive="trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}/${archive}"
          echo "${TRUFFLEHOG_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/bin" trufflehog
          "$RUNNER_TEMP/bin/trufflehog" --version
          "$RUNNER_TEMP/bin/trufflehog" git file://. --results=verified,unknown --fail --no-update
