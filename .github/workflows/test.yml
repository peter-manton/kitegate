name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest
      - name: Built Open WebUI filter is in step with the source
        run: python tools/build_owui_filter.py --check
      - name: Built Open WebUI photo tool is in step with the source
        run: python tools/build_owui_photo.py --check

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Gateway image builds
        run: docker build -f adapters/gateway/Dockerfile -t kitegate-ci .
