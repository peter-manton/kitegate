# Open WebUI for a family or classroom, with every model call going through
# the Kitegate gateway. Run ./setup.sh (or setup.ps1 / start.cmd on Windows)
# the first time; afterwards `docker compose up -d` in this folder.
#
#   browser -> Open WebUI -> kitegate -> your model provider
#                                              \-> or Ollama on this machine (COMPOSE_PROFILES=local)
#
# Only Open WebUI is published, on 127.0.0.1. The gateway and Ollama are
# reachable only on the internal Docker network.
name: kitegate

services:
  kitegate:
    build:
      context: ../..
      dockerfile: adapters/gateway/Dockerfile
    restart: unless-stopped
    environment:
      KITEGATE_API_KEY: ${KITEGATE_API_KEY:?run setup first}
      KITEGATE_UPSTREAM_URL: ${KITEGATE_UPSTREAM_URL:?run setup first}
      KITEGATE_UPSTREAM_API_KEY: ${KITEGATE_UPSTREAM_API_KEY:-}
      KITEGATE_UPSTREAM_KIND: openai
      KITEGATE_CHILD_MODELS: kids-encyclopedia=${KITEGATE_UPSTREAM_MODEL:?run setup first}
      KITEGATE_CHILD_USERS: ${KITEGATE_CHILD_USERS:-}
      # Only these accounts get an adult model. Anyone else is refused on it.
      KITEGATE_ADULT_USERS: ${KITEGATE_ADULT_USERS:-}
      KITEGATE_PACK: ${KITEGATE_PACK:-secular-neutral}
      KITEGATE_PACK_KEYS: ${KITEGATE_PACK_KEYS:-}
      KITEGATE_REQUIRE_SIGNED_PACKS: "true"
      # A system prompt set in Open WebUI (an admin's, or a user's own). Blank
      # means "drop": it is ignored, because a user can write their own and it
      # would sit inside the gateway's trusted message. "fold" puts it in below
      # the core and pack framing, after the reply screen has checked it.
      KITEGATE_CLIENT_SYSTEM: ${KITEGATE_CLIENT_SYSTEM:-drop}
      # Adults' models pass through unscreened, for KITEGATE_ADULT_USERS only.
      KITEGATE_PASSTHROUGH: "true"
      KITEGATE_BLOCK_LOG: /var/lib/kitegate/blocks.jsonl
      KITEGATE_ALERT_WEBHOOK: ${KITEGATE_ALERT_WEBHOOK:-}
      # Pictures. Empty is not "off": the gateway scans them when there is a
      # moderation key and removes them when there is not, so a child is never
      # shown an unscanned picture either way. "block" removes them whatever
      # the key says. The photographs come from the gateway's own find_photo
      # tool, so nothing is installed in Open WebUI; see section 9 of
      # docs/quickstart.md.
      KITEGATE_IMAGE_POLICY: ${KITEGATE_IMAGE_POLICY:-}
      # Blank means Wikipedia lead images. "off" removes the tool.
      KITEGATE_PHOTOS: ${KITEGATE_PHOTOS:-}
      KITEGATE_IMAGE_SCAN_API_KEY: ${KITEGATE_IMAGE_SCAN_API_KEY:-}
      # Blank means the hosts of the providers Kitegate ships, which is what
      # you want: both Wikimedia hosts (measured, scaled thumbnails come from
      # thumb.wikimedia.org and unscaled originals from upload.wikimedia.org,
      # so listing one silently drops the other) and NASA's.
      KITEGATE_IMAGE_HOSTS: ${KITEGATE_IMAGE_HOSTS:-}
    volumes:
      - blocklog:/var/lib/kitegate
    # Hardening. The image is distroless and runs as a non-root user; these stop
    # it writing anywhere but the block-log volume, gaining privileges or
    # acquiring Linux capabilities. It listens on 8080, above the privileged
    # range, so it needs no capability.
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.12.4@sha256:a5b9e403d19154796850679c8c5d1295301cee954be8b84ddd62af92426558f7
    restart: unless-stopped
    depends_on:
      kitegate:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
        required: false   # only with COMPOSE_PROFILES=local
    ports:
      - "127.0.0.1:${WEBUI_PORT:-3000}:8080"
    environment:
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?run setup first}
      # The settings below win on every start. Without this, Open WebUI keeps
      # the values from its first start in its database, so a changed key in
      # .env would break the connection and a setting switched on in the
      # admin panel would stay on. Users, chats and models are kept either way.
      ENABLE_PERSISTENT_CONFIG: "False"
      # One connection, to the gateway. Nothing else can reach a model.
      ENABLE_OPENAI_API: "True"
      OPENAI_API_BASE_URL: http://kitegate:8080/v1
      OPENAI_API_KEY: ${KITEGATE_API_KEY}
      ENABLE_OLLAMA_API: "False"
      ENABLE_DIRECT_CONNECTIONS: "False"
      # Tells the gateway who is asking (X-OpenWebUI-User-Email).
      ENABLE_FORWARD_USER_INFO_HEADERS: "True"
      DEFAULT_MODELS: kids-encyclopedia
      # Every signed-in user sees every model, so the bundle works without
      # publishing models by hand. The gateway, not this list, keeps children
      # on kids-encyclopedia: any other model refuses them. Set to "False" to
      # manage model visibility per group in Admin Panel > Settings > Models.
      BYPASS_MODEL_ACCESS_CONTROL: "True"
      # Features that reach the web, run code or share chats: off.
      ENABLE_WEB_SEARCH: "False"
      ENABLE_CODE_EXECUTION: "False"
      ENABLE_CODE_INTERPRETER: "False"
      ENABLE_IMAGE_GENERATION: "False"
      ENABLE_COMMUNITY_SHARING: "False"
      ENABLE_EVALUATION_ARENA_MODELS: "False"
      # Open WebUI 0.12 sends about forty built-in tools (notes, memory,
      # tasks, automations, fetch_url, ...) with every chat from the browser.
      # None of them belong in a children's encyclopedia, and a small model
      # lost among them never reaches the gateway's find_photo and answers
      # with something like "which task would you like to update?". Off for
      # every model, so the gateway's own tool is the only one on offer.
      DEFAULT_MODEL_METADATA: '{"capabilities": {"builtin_tools": false}}'
      # New sign-ups wait for an admin to approve them.
      DEFAULT_USER_ROLE: pending
    volumes:
      - open-webui:/app/backend/data

  # COMPOSE_PROFILES=local: a model on this machine instead of a provider.
  ollama:
    profiles: [local]
    image: ollama/ollama:0.40.2@sha256:b86366bb528bbf7f1424435d165028497a5b69bf6ddb4fa5a87102e2b79f44fb
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama

  # Downloads the model once (several GB), then exits.
  ollama-pull:
    profiles: [local]
    image: ollama/ollama:0.40.2@sha256:b86366bb528bbf7f1424435d165028497a5b69bf6ddb4fa5a87102e2b79f44fb
    depends_on: [ollama]
    entrypoint: ["sh", "-c", "until ollama list >/dev/null 2>&1; do sleep 2; done; ollama pull \"$$MODEL\""]
    environment:
      OLLAMA_HOST: ollama:11434
      MODEL: ${KITEGATE_UPSTREAM_MODEL:-gemma4:e2b}
    restart: "no"

volumes:
  open-webui:
  ollama:
  # What children typed when they were blocked. Sensitive.
  blocklog:
