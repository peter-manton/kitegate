[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kitegate"
version = "0.1.0"
description = "A safety core for children's AI services, with swappable, signed values packs."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
# cryptography checks pack signatures (Ed25519).
dependencies = ["PyYAML==6.0.3", "cryptography==50.0.2"]
keywords = ["children", "safety", "guardrails", "llm", "content-filter", "safeguarding"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Chat",
    "Topic :: Security",
]

[project.optional-dependencies]
# The OpenAI-compatible gateway. The core above needs none of this.
gateway = ["fastapi==0.143.0", "httpx==0.28.1", "uvicorn==0.54.0"]
dev = ["pytest==9.1.1", "fastapi==0.143.0", "httpx==0.28.1", "uvicorn==0.54.0"]

[project.scripts]
kitegate = "kitegate.gateway:main"
kitegate-pack = "kitegate.packtool:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kitegate = ["packs/*.yaml", "packs/*.yaml.sig"]

[tool.bandit]
# Read by the bandit pre-commit hook, and by `bandit -c pyproject.toml -r .`
# run by hand. tests/ asserts are the point of the file rather than a finding.
exclude_dirs = ["tests", "build", ".venv", ".git"]

[tool.semantic_release]
# Releases are cut by .github/workflows/release.yml on every push to main,
# from the Conventional Commit messages since the last tag (PR titles, as PRs
# are squash-merged): fix/perf -> patch, feat -> minor, a breaking change ->
# major, anything else -> no release. While on 0.x a breaking change bumps the
# minor instead; set major_on_zero = true when ready for 1.0.0.
commit_parser = "conventional"
tag_format = "v{version}"
allow_zero_version = true
major_on_zero = false
commit_message = "chore(release): v{version}"
commit_author = "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
version_toml = ["pyproject.toml:project.version"]
# Every place the version is written out.
version_variables = ["src/kitegate/__init__.py:__version__"]
# Runs after the version is stamped and before the release commit. The sdist
# and wheel go to build/pkg, which is ignored, so nothing built is committed.
build_command = "python -m build --outdir build/pkg"

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.changelog]
exclude_commit_patterns = ['''^chore\(release\):''']

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

[tool.semantic_release.remote]
type = "github"
token = { env = "GH_TOKEN" }

[tool.semantic_release.publish]
# Attached to the GitHub Release: the package.
dist_glob_patterns = ["build/pkg/*"]
upload_to_vcs_release = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Run from a clean checkout with no install. Without this, `pytest` collects
# nothing but ModuleNotFoundError for kitegate unless someone has remembered
# `pip install -e .`, and the failure looks like a broken test suite rather
# than a missing step. An editable install still takes precedence.
pythonpath = ["src"]
# Live checks reach the real Wikipedia and OpenAI APIs, so they are opt-in:
#   pytest -m live
markers = ["live: needs network and real API credentials; deselected by default"]
addopts = "-m 'not live'"
